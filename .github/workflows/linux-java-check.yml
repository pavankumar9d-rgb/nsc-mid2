name: linux-java-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile all programs
        run: javac "internal 2"/*.java

      - name: Run substitution cipher
        run: java -cp "internal 2" substitutioncipher

      - name: Run Rijndael/AES
        run: java -cp "internal 2" rijndaelaes

      - name: Run SHA-1 digest
        run: java -cp "internal 2" sha1digest

      - name: Run DES
        run: java -cp "internal 2" desalgorithm
